---
layout: default
---
<div class="blog-page-wrapper">
    <header class="hero-small" style="background: white; color: var(--black); border-bottom: none;">
        <span style="text-transform: uppercase; letter-spacing: 3px; font-size: 0.7rem; font-weight: 800; color: var(--accent);">Our Mission</span>
        <h1 style="font-size: 4rem; margin-top: 10px;">{{ page.title }}</h1>
        <p style="color: #666; font-size: 1.4rem; max-width: 700px;">{{ page.subtitle }}</p>
    </header>

    <article class="editorial-content">
        {{ content }}
    </article>
</div>
