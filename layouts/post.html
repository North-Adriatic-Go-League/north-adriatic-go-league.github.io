---
layout: default
---
<div class="blog-page-wrapper">
    <header class="hero-small" style="background: white; color: var(--black); border-bottom: none; padding-bottom: 2rem;">
        <span style="text-transform: uppercase; letter-spacing: 3px; font-size: 0.7rem; font-weight: 800; color: var(--accent);">
            News & Updates • {{ page.date | date: "%b %-d, %Y" }}
        </span>
        <h1 style="font-size: 4rem; margin-top: 10px;">{{ page.title }}</h1>
        {% if page.subtitle %}
        <p style="color: #666; font-size: 1.4rem; max-width: 700px;">{{ page.subtitle }}</p>
        {% endif %}
    </header>

    <article class="editorial-content">
        {{ content }}
        
        <div style="margin-top: 4rem; border-top: 1px solid var(--border); padding-top: 2rem;">
            <a href="/blog" class="read-link">← Back to Blog</a>
        </div>
    </article>
</div>
