---
layout: default
---

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    /* --- Specific stype for popup --- */
    .leaflet-popup-content-wrapper {
        background: var(--black) !important;
        color: white !important;
        border-radius: 0px !important;
        box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }

    .leaflet-popup-tip {
        background: var(--black) !important;
    }

    .leaflet-popup-content {
        margin: 20px !important;
        min-width: 220px;
    }

    .nagl-popup-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.4rem;
        color: var(--accent);
        display: block;
        margin-bottom: 5px;
        line-height: 1.2;
    }

    .nagl-popup-desc {
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        line-height: 1.5;
        opacity: 0.8;
        margin-top: 10px;
    }

    .nagl-popup-footer {
        display: block;
        margin-top: 15px;
        padding-top: 10px;
        border-top: 1px solid #333;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #666;
    }

    /* Remove background color white */
    #map {
        background: #111;
        cursor: crosshair;
    }
</style>

<div class="blog-page-wrapper">
    <header class="hero-small">
        <h1>{{ page.title }}</h1>
        <p>{{ page.subtitle }}</p>
    </header>

    <div id="map" style="height: 600px; width: 100%;"></div>

    <section class="blog-container">
        <div class="blog-intro" style="text-align: center;">
            {{ content }}
        </div>
    </section>
</div>

<script>
    // 1. Init map: Center to regions
    var map = L.map('map', {
        scrollWheelZoom: false 
    }).setView([45.8, 13.8], 8);

    // 2. Load Tile "Dark"
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // 3. Database Club
    var clubs = [
        { 
            name: "Higashikita Go Club - Trieste", 
            coords: [45.649, 13.776], 
            desc: "The historic hub by the sea. Meeting point for international players." 
        },
        { 
            name: "Sežana Go Club", 
            coords: [45.703, 13.873], 
            desc: "Where the Karst landscape meets the strategic intensity of Go." 
        },
        { 
            name: "Higashikita Go Club - Udine", 
            coords: [46.062, 13.234], 
            desc: "The friulian heart of the league. Strong players, warm welcome." 
        },
        { 
            name: "Go club Tesuji - Porec",
            coords: [45.227, 13.594], 
            desc: "Istrian excellence. Spreading the game along the beautiful coast." 
        },
        { 
            name: "Sente Go Club - Ronchi dei Legionari", 
            coords: [45.827, 13.506], 
            desc: "A new Go Club has born." 
        }
    ];

    // 4. Marker and Popup
    clubs.forEach(function(club) {
        var marker = L.circleMarker(club.coords, {
            color: '#ffffff',
            weight: 1,
            fillColor: '#8b5e3c', 
            fillOpacity: 0.9,
            radius: 10
        }).addTo(map);

        // Template HTML for Popup
        var popupHTML = `
            <div class="nagl-popup-content">
                <span class="nagl-popup-title">${club.name}</span>
                <div class="nagl-popup-desc">${club.desc}</div>
                <span class="nagl-popup-footer">NAGL Member Club</span>
            </div>
        `;

        marker.bindPopup(popupHTML, {
            maxWidth: 300,
            className: 'nagl-custom-popup'
        });

        // Hover
        marker.on('mouseover', function (e) {
            this.openPopup();
        });
    });
</script>
